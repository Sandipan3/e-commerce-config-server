server:
  port: 8081

spring:
  application:
    name: user-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/user_db
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

user:
  verification:
    token-ttl: 24h
  vendor:
    requires-admin-approval: true

brevo:
  api-key: ${BREVO_API_KEY:}
  sender-email: ${BREVO_SENDER_EMAIL:no-reply@example.com}
  sender-name: ${BREVO_SENDER_NAME:E-Commerce}

jwt:
  access-token-ttl: 15m
  refresh-token-ttl: 7d
  secret: ${JWT_SECRET:change-me-super-secret-key-min-32-chars}